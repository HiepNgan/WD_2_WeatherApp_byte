<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />

<body>

  <!-- Nơi JS sẽ tạo hiệu ứng mưa/tuyết/mây... theo đúng thời tiết -->
  <div class="weather-fx" id="weather-fx"></div>

  <!-- Lớp phủ tối khi đang là ban đêm ở thành phố đó -->
  <div class="night-overlay" id="night-overlay"></div>

  <main class="card">

      <!-- ===== CỘT TRÁI: tìm kiếm + gấu dự báo ===== -->
      <div class="left-panel">
        <h1>Weather App</h1>

        <form id="search-form">
          <div class="search-wrap">
              <input
                type="text"
                id="city-input"
                placeholder="Enter a city name..."
                autocomplete="off"
              />
            <ul class="suggestions" id="suggestions" hidden></ul>
          </div>
            <button type="submit">Search</button>
        </form>

        <button type="button" id="location-btn">📍 Use my location</button>

        <p id="error-message" hidden></p>

        <!-- Gấu dự báo — trang phục đổi theo thời tiết -->
        <div class="bear-wrap">
          <svg viewBox="-50 -30 315 295" class="bear" id="bear">
            <defs>
              <filter id="softblur" x="-30%" y="-100%" width="160%" height="300%">
                <feGaussianBlur stdDeviation="3" />
              </filter>
            </defs>

                <animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite" />

              <ellipse cx="138" cy="258" rx="6" ry="2" fill="none" stroke="#ffffff" stroke-width="1.5">
                <animate attributeName="rx" values="6;32" dur="1.6s" begin="0.8s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="0.9;0" dur="1.6s" begin="0.8s" repeatCount="indefinite" />
              </ellipse>
            </g>

                <circle cx="174" cy="184" r="8" fill="#a78bfa" />
                <circle cx="152" cy="184" r="3" fill="#fef08a" class="no-stroke" />
                <circle cx="163" cy="176" r="3" fill="#fb7185" class="no-stroke" />
                <circle cx="174" cy="184" r="3" fill="#fef08a" class="no-stroke" />
              </g>
              <circle cx="163" cy="212" r="12" fill="#c78f5f" />
            </g>

            <!-- Trời nóng: cầm kem ở tay trái -->
            <g class="accessory acc-icecream">
              <path d="M24 198 L50 198 L37 242 Z" fill="#f59e0b" />
              <line x1="28" y1="205" x2="43" y2="226" stroke="#b45309" stroke-width="1.5" />
              <line x1="46" y1="205" x2="31" y2="226" stroke="#b45309" stroke-width="1.5" />
              <circle cx="37" cy="188" r="13" fill="#f9a8d4" />
              <circle cx="37" cy="175" r="11" fill="#fef3c7" />
              <circle cx="37" cy="164" r="3.5" fill="#dc2626" />
              <circle cx="37" cy="213" r="12" fill="#c78f5f" />
              <ellipse cx="51" cy="194" rx="3" ry="5" fill="#f9a8d4" class="no-stroke">
                <animateTransform attributeName="transform" type="translate" values="0 0;0 16" dur="2s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" />
              </ellipse>
            </g>

            <!-- Dù to (mưa) — cầm ở tay phải -->
            <g class="accessory acc-umbrella">
              <line x1="163" y1="-14" x2="163" y2="212" stroke="#334155" stroke-width="4" />
              <path d="M83 26 Q163 -62 243 26 Z" fill="#3b82f6" />
              <path d="M163 -17 Q140 6 123 26" class="seam" fill="none" />
              <path d="M163 -17 Q186 6 203 26" class="seam" fill="none" />
              <circle cx="163" cy="-17" r="3" fill="#334155" class="no-stroke" />
              <circle cx="163" cy="214" r="13" fill="#c78f5f" />
            </g>

            <!-- Tuyết bám trên đầu, tai và vai (cục tuyết có mép lượn) -->
            <g class="accessory acc-snowcap">
              <path d="M38 46 Q38 30 55 30 Q72 30 72 46 Q66 41 61 46 Q55 41 49 46 Q43 41 38 46 Z" fill="#dbeafe" />
              <path d="M128 46 Q128 30 145 30 Q162 30 162 46 Q156 41 151 46 Q145 41 139 46 Q133 41 128 46 Z" fill="#dbeafe" />
              <path d="M76 38 Q80 22 100 22 Q120 22 124 38 Q118 33 112 38 Q106 33 100 38 Q94 33 88 38 Q82 33 76 38 Z" fill="#dbeafe" />
              <path d="M21 155 Q21 138 37 138 Q53 138 53 155 Q47 150 42 155 Q37 150 32 155 Q27 150 21 155 Z" fill="#dbeafe" />
              <path d="M147 155 Q147 138 163 138 Q179 138 179 155 Q173 150 168 155 Q163 150 158 155 Q153 150 147 155 Z" fill="#dbeafe" />
            </g>

            <!-- Trời nóng: giọt mồ hôi chảy xuống -->
            <g class="accessory acc-sweat">
              <g>
                <animateTransform attributeName="transform" type="translate" values="0 0;0 14" dur="1.8s" repeatCount="indefinite" />
                <path d="M52 82 Q59 94 52 100 Q45 94 52 82 Z" fill="#7dd3fc" />
              </g>
              <g>
                <animateTransform attributeName="transform" type="translate" values="0 0;0 14" dur="1.8s" begin="0.9s" repeatCount="indefinite" />
                <path d="M148 82 Q155 94 148 100 Q141 94 148 82 Z" fill="#7dd3fc" />
              </g>
            </g>

            <!-- Bão: gấu trốn trong nhà, ló mặt qua cửa sổ -->
            <g class="accessory acc-house">
              <rect x="140" y="62" width="20" height="40" fill="#9ca3af" />
              <path d="M16 130 L100 52 L184 130 Z" fill="#b45309" />
              <rect x="30" y="126" width="140" height="120" rx="4" fill="#fde68a" />
              <rect x="120" y="182" width="34" height="64" rx="4" fill="#92400e" />
              <circle cx="146" cy="216" r="3" fill="#fbbf24" class="no-stroke" />
              <rect x="48" y="146" width="62" height="56" rx="8" fill="#bae6fd" />
              <g>
                <animateTransform attributeName="transform" type="translate" values="-1.2 0;1.2 0;-1.2 0" dur="0.22s" repeatCount="indefinite" />
                <circle cx="67" cy="163" r="7" fill="#a9744f" />
                <circle cx="93" cy="163" r="7" fill="#a9744f" />
                <circle cx="80" cy="177" r="19" fill="#c78f5f" />
                <ellipse cx="80" cy="183" rx="8" ry="6" fill="#f1dcc0" />
                <circle cx="80" cy="180" r="2.6" fill="#5c3b25" class="no-stroke" />
                <circle cx="73" cy="172" r="2.4" fill="#3b2a1a" class="no-stroke" />
                <circle cx="87" cy="172" r="2.4" fill="#3b2a1a" class="no-stroke" />
                <path d="M75 190 Q80 186 85 190" class="seam" fill="none" />
              </g>
              <rect x="48" y="146" width="62" height="56" rx="8" fill="#fef9c3" class="no-stroke">
                <animate attributeName="opacity" values="0;0;0;0.85;0;0.6;0;0;0" dur="3s" repeatCount="indefinite" />
              </rect>
              <path d="M30 40 L14 78 L28 78 L20 112 L48 68 L32 68 L42 40 Z" fill="#fde047">
                <animate attributeName="opacity" values="1;1;0.2;1;0.3;1" dur="1.5s" repeatCount="indefinite" />
              </path>
            </g>

            <!-- ===== Hiệu ứng động theo thời tiết (không có viền) ===== -->

            <!-- Nước nhỏ giọt từ mép dù -->
            <g class="fx fx-drips">
              <ellipse cx="90" cy="30" rx="2" ry="3.5" fill="#93c5fd">
                <animateTransform attributeName="transform" type="translate" values="0 0;0 60" dur="1.1s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="1;0" dur="1.1s" repeatCount="indefinite" />
              </ellipse>
              <ellipse cx="163" cy="30" rx="2" ry="3.5" fill="#93c5fd">
                <animateTransform attributeName="transform" type="translate" values="0 0;0 60" dur="1.1s" begin="0.4s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="1;0" dur="1.1s" begin="0.4s" repeatCount="indefinite" />
              </ellipse>
              <ellipse cx="236" cy="30" rx="2" ry="3.5" fill="#93c5fd">
                <animateTransform attributeName="transform" type="translate" values="0 0;0 60" dur="1.1s" begin="0.8s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="1;0" dur="1.1s" begin="0.8s" repeatCount="indefinite" />
              </ellipse>
            </g>

            <!-- Trời lạnh: hơi thở trắng -->
            <g class="fx fx-breath">
              <g>
                <animateTransform attributeName="transform" type="translate" values="0 0;22 -8" dur="2.4s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" repeatCount="indefinite" />
                <ellipse cx="128" cy="122" rx="7" ry="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
                <ellipse cx="138" cy="118" rx="9" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
                <ellipse cx="150" cy="114" rx="7" ry="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
              </g>
            </g>

            <!-- Nắng: kính lấp lánh -->
            <g class="fx fx-glint">
              <g transform="translate(74 78)">
                <path d="M0 -9 L2 -2 L9 0 L2 2 L0 9 L-2 2 L-9 0 L-2 -2 Z" fill="#ffffff">
                  <animateTransform attributeName="transform" type="scale" values="0.1;1;0.1" dur="2s" repeatCount="indefinite" />
                </path>
              </g>
              <g transform="translate(126 44)">
                <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#fffbeb">
                  <animateTransform attributeName="transform" type="scale" values="0.1;1;0.1" dur="2s" begin="1s" repeatCount="indefinite" />
                </path>
              </g>
            </g>

            <!-- Trời nóng: hơi nóng bốc lên -->
            <g class="fx fx-heat">
              <g>
                <animateTransform attributeName="transform" type="translate" values="0 6;0 -16" dur="2s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite" />
                <path d="M-10 70 q6 -8 0 -16 t0 -16" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" />
              </g>
              <g>
                <animateTransform attributeName="transform" type="translate" values="0 6;0 -16" dur="2s" begin="0.7s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="0;0.8;0" dur="2s" begin="0.7s" repeatCount="indefinite" />
                <path d="M210 70 q6 -8 0 -16 t0 -16" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" />
              </g>
            </g>

            <!-- Trời đẹp: bướm bay quanh -->
            <g class="fx fx-butterfly">
              <g>
                <animateMotion path="M20 60 C50 20 90 10 130 30 S200 90 170 120 S60 110 20 60" dur="9s" repeatCount="indefinite" />
                <g>
                  <animateTransform attributeName="transform" type="scale" values="1 1;0.3 1;1 1" dur="0.35s" repeatCount="indefinite" />
                  <path d="M0 0 C-6 -10 -16 -8 -13 0 C-16 8 -6 8 0 0 Z" fill="#f472b6" />
                  <path d="M0 0 C6 -10 16 -8 13 0 C16 8 6 8 0 0 Z" fill="#f472b6" />
                </g>
                <rect x="-1" y="-4" width="2" height="8" rx="1" fill="#3b2a1a" />
              </g>
            </g>

            <!-- Sương mù: mây mù trôi ngang (nằm thấp, không che mặt gấu) -->
            <g class="fx fx-fog">
              <ellipse cx="100" cy="128" rx="96" ry="12" fill="#ffffff" opacity="0.5" filter="url(#softblur)">
                <animateTransform attributeName="transform" type="translate" values="-24 0;24 0;-24 0" dur="7s" repeatCount="indefinite" />
              </ellipse>
              <ellipse cx="100" cy="178" rx="104" ry="14" fill="#ffffff" opacity="0.5" filter="url(#softblur)">
                <animateTransform attributeName="transform" type="translate" values="24 0;-24 0;24 0" dur="9s" repeatCount="indefinite" />
              </ellipse>
              <ellipse cx="100" cy="232" rx="96" ry="12" fill="#ffffff" opacity="0.55" filter="url(#softblur)">
                <animateTransform attributeName="transform" type="translate" values="-20 0;20 0;-20 0" dur="8s" repeatCount="indefinite" />
              </ellipse>
            </g>

            <!-- Gió mạnh: những vệt gió thổi ngang -->
            <g class="fx fx-wind">
              <g>
                <animateTransform attributeName="transform" type="translate" values="-30 0;40 0" dur="1.2s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="0;0.8;0" dur="1.2s" repeatCount="indefinite" />
                <path d="M-20 100 h50 q8 0 8 -7" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
              </g>
              <g>
                <animateTransform attributeName="transform" type="translate" values="-30 0;40 0" dur="1.2s" begin="0.4s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="0;0.8;0" dur="1.2s" begin="0.4s" repeatCount="indefinite" />
                <path d="M-20 150 h60 q9 0 9 8" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
              </g>
              <g>
                <animateTransform attributeName="transform" type="translate" values="-30 0;40 0" dur="1.2s" begin="0.8s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="0;0.8;0" dur="1.2s" begin="0.8s" repeatCount="indefinite" />
                <path d="M-20 200 h44 q8 0 8 -7" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
              </g>
            </g>
          </svg>
        </div>
      </div>

      <!-- ===== CỘT PHẢI: kết quả thời tiết ===== -->
      <div class="right-panel">
        <section id="weather-result" hidden>
          <p id="city-name"></p>
          <p id="local-time"></p>

          <div class="current-weather">
            <img id="weather-icon" src="" alt="" />
            <div>
              <p id="temperature"></p>
              <p id="condition"></p>
              <p id="humidity"></p>
              <p id="feels-like"></p>
            </div>
          </div>

          <p id="last-updated"></p>

          <p class="section-title">
            <span id="hourly-title-text">Next 24 Hours</span>
            <span class="est-note">(temps estimated between real 3-hour readings)</span>
            <button type="button" id="back-to-now-btn" class="back-link" hidden>Back to Next 24h</button>
          </p>
          <div class="hourly-grid" id="hourly-grid"></div>

          <p class="section-title">5-Day Forecast</p>
          <div class="forecast-grid" id="forecast-grid"></div>
        </section>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
